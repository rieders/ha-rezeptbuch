[project]
name = "ha-rezeptbuch"
version = "0.1.0"
description = "Rezeptbuch – eigenständige Rezeptdatenbank für Home Assistant"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py313"  # Code bleibt Python-3.13-kompatibel (ältere HA-Versionen)
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
