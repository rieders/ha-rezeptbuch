name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: ruff installieren
        run: pip install "$(grep '^ruff==' requirements_test.txt)"
      - name: ruff check
        run: ruff check custom_components tests
      - name: ruff format --check
        run: ruff format --check custom_components tests

  tests:
    name: pytest (Python ${{ matrix.python }}, HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mindestversion laut hacs.json
          - python: "3.13"
            ha: "2026.2.3"
            phcc: "0.13.316"
          # wie lokal
          - python: "3.14"
            ha: "2026.10.4"
            phcc: "0.13.375"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          grep -v '^pytest-homeassistant-custom-component' requirements_test.txt > /tmp/req.txt
          pip install -r /tmp/req.txt "pytest-homeassistant-custom-component==${{ matrix.phcc }}"
          python -c "import importlib.metadata as m; v = m.version('homeassistant'); print('HA', v); assert v == '${{ matrix.ha }}', v"

      - name: pytest
        run: pytest -q -p no:cacheprovider
